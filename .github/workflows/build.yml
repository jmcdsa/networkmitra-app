name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android part of the project
        run: flutter create --platforms=android --org store.ftc4u --project-name networkmitra .

      - name: Allow internet and set the app name
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="NetworkMitra"#' android/app/src/main/AndroidManifest.xml

      - name: Use the same signing key every time (so new APK installs over the old one)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Use a newer Android API level for every plugin (fixes file_picker error)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null) {
                a.compileSdkVersion(36)
              }
            }
          }
          EOF

      - run: flutter pub get

      - name: Build the APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Write signing information (to find update problems)
        run: |
          echo "Build number: ${{ github.run_number }}" > build/signing-info.txt
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk >> build/signing-info.txt 2>&1 || true
          cat build/signing-info.txt

      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMitra-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/signing-info.txt
