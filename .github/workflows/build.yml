name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android part of the project
        run: flutter create --platforms=android --org store.ftc4u --project-name networkmitra .

      - name: Allow internet and set the app name
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="NetworkMitra"#' android/app/src/main/AndroidManifest.xml

      - name: Use the same signing key every time (so new APK installs over the old one)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build the APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMitra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
